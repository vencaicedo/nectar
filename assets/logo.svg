<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="nectarAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5994A" />
      <stop offset="50%" stop-color="#C97B2E" />
      <stop offset="100%" stop-color="#9E5616" />
    </linearGradient>
  </defs>

  <!-- Isotipo (Gota + N) más grande, nítido y balanceado -->
  <g transform="translate(10, 8)">
    <!-- Silueta exterior de la gota -->
    <path d="M 37 4 
             C 40 9, 68 45, 68 62 
             A 29 29 0 1 1 6 62 
             C 6 45, 34 9, 37 4 Z" 
          fill="none" 
          stroke="url(#nectarAmber)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Trazo interior fluido 'N' -->
    <path d="M 21 68 
             L 21 40 
             C 21 34, 30 28, 40 43 
             L 51 60 
             C 56 67, 54 72, 46 72
             C 38 72, 33 65, 33 57" 
          fill="none" 
          stroke="url(#nectarAmber)" 
          stroke-width="4.8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Punto/gota central -->
    <circle cx="37" cy="27" r="4" fill="#C97B2E" />
  </g>

  <!-- Texto NECTAR grande, legible y con tipografía Fraunces -->
  <g transform="translate(96, 56)">
    <text font-family="'Fraunces', Georgia, serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="1" 
          fill="#23170C">
      Nectar
    </text>
    <text x="3" y="19" 
          font-family="'DM Sans', -apple-system, sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="5" 
          fill="#C97B2E">
      PERFUMES ORIGINALES
    </text>
  </g>
</svg>
